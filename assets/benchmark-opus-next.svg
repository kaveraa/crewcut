<text x="20" y="418" font-size="11" opacity="0.85">Each bar is that arm's mean over all cells as a percent of the no-plugin baseline (the gray 100% bars). Lower is leaner, cheaper, faster.</text>
<line x1="20" y1="438" x2="815" y2="438" class="grid" stroke-opacity="0.25"/>
<text x="20" y="460" font-size="11" opacity="0.9">Safety, separate 7-task adversarial tier (path traversal, SQL injection, token forgery, malformed input, rate limit). Higher is safer:</text>
