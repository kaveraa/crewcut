<svg viewBox="0 0 860 490" width="860" height="490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="baseline: LOC 100%, tokens 100%, cost 100%, time 100%, safe 100%; crewcut: LOC 18%, tokens 45%, cost 40%, time 33%, safe 100%; crewcut-notests: LOC 17%, tokens 43%, cost 37%, time 31%, safe 100%; yagni-oneliner: LOC 12%, tokens 38%, cost 34%, time 28%, safe 100%">
