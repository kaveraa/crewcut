<text x="777" y="127.0" font-size="10" text-anchor="middle" class="ink">95%</text>
<text x="720" y="380" font-size="13" text-anchor="middle">time</text>
<text x="720" y="395" font-size="10" text-anchor="middle" opacity="0.8">base 52s</text>
<text x="20" y="418" font-size="11" opacity="0.85">Each bar is that arm's mean over all cells as a percent of the no-plugin baseline (the gray 100% bars). Lower is leaner, cheaper, faster.</text>
<line x1="20" y1="438" x2="815" y2="438" class="grid" stroke-opacity="0.25"/>
<text x="20" y="460" font-size="11" opacity="0.9">Safety, separate 7-task adversarial tier (path traversal, SQL injection, token forgery, malformed input, rate limit). Higher is safer:</text>
<rect x="90" y="468" width="10" height="10" rx="2" class="base"/><text x="105" y="478" class="ink">baseline 100%</text>
<rect x="230" y="468" width="10" height="10" rx="2" class="caveman"/><text x="245" y="478" class="ink">caveman 100%</text>
<rect x="370" y="468" width="10" height="10" rx="2" class="crewcut"/><text x="385" y="478" class="ink" font-weight="600">crewcut 100%</text>
<rect x="510" y="468" width="10" height="10" rx="2" class="yagni"/><text x="525" y="478" class="ink">yagni-oneliner <tspan class="bad" font-weight="600">96%</tspan></text>
