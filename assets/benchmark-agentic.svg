<svg viewBox="0 0 860 490" width="860" height="490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="baseline: LOC 100%, tokens 100%, cost 100%, time 100%, safe 100%; caveman: LOC 104%, tokens 109%, cost 106%, time 103%, safe 100%; crewcut: LOC 86%, tokens 97%, cost 96%, time 93%, safe 100%; yagni-oneliner: LOC 112%, tokens 85%, cost 111%, time 95%, safe 96%">
<title>Every metric vs the no-plugin baseline (Claude Code, Haiku 4.5, 12 tasks)</title>
<style>
