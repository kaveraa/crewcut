  .onbar { fill: #ffffff; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c3c2b7; } .t, .v, .pct { fill: #ffffff; }
    .cut { stroke: #ffffff; } .crewcut { fill: #3987e5; } .caveman { stroke: #d95926; } .yagni { stroke: #199e70; }
