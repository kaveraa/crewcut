<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 792" width="920" height="792" role="img" aria-label="Lines added per task: the baseline bar hatched, the crewcut bar solid, caveman and the yagni prompt as thin lines">
<title>Lines added per task, Claude Code on Haiku 4.5, four runs per cell</title>
<style>
