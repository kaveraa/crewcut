schema_version: "1.0"
name: shared-bug
description: "A bug in a shared function with three callers. Expected: one fix in formatPrice, no guard in any caller, the root cause stated in one line."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: formatPrice returns NaN in checkout.js when the amount comes from the form. Fix it.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Grep, Glob, Skill]
runs: 3
graders:
  - type: file_exists
    name: no-new-file
    path: "**/*"
    exists: false
  - type: regex
    name: fix-in-shared-function
    target: { source: file, path: price.js }
    pattern: 'Number\(|parseFloat\(|\+amount|\* 1'
    match: contains
  - type: regex
    name: no-guard-in-checkout
    target: { source: file, path: checkout.js }
    pattern: 'Number\(|parseFloat\(|\+form\.amount'
    match: not_contains
  - type: regex
    name: no-guard-in-cart
    target: { source: file, path: cart.js }
    pattern: 'Number\(|parseFloat\('
    match: not_contains
  - type: llm
    name: correct-fix
    focus: { source: file, path: price.js }
    criteria: >
      formatPrice('12.50') now gives '12.50 EUR' and formatPrice(12.5) still
      gives '12.50 EUR'. formatPrice('abc') gives NaN or throws; it never
      returns a string that contains NaN. The function is still named
      formatPrice and still exported. Extra care for empty strings or
      whitespace is acceptable, not required.
  - type: llm
    name: root-cause-stated
    criteria: >
      The final message states the root cause (the amount arrives as a string
      from the form and formatPrice only accepted numbers) in at most two
      sentences, says the fix is in formatPrice so every caller gets it, and
      is at most 12 lines in total counting blank lines. It may mention the
      other callers in one sentence. It must not describe a change made to
      checkout.js, cart.js or invoice.js.
