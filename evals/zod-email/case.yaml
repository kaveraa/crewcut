schema_version: "1.0"
name: zod-email
description: "A validation the installed version changed. The manifest declares zod 4, where the string format is a top-level call and the chained method is deprecated. Expected: z.email(), no chained .email(), no new dependency, no new file."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add an email field to the signup schema in src/schemas/signup.js. It must be a valid email address.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Grep, Glob, Skill]
runs: 3
graders:
  - type: file_exists
    name: no-new-file
    path: "**/*"
    exists: false
  - type: regex
    name: uses-current-api
    target: { source: file, path: src/schemas/signup.js }
    pattern: 'z\.email\('
    match: contains
  - type: regex
    name: no-deprecated-chain
    target: { source: file, path: src/schemas/signup.js }
    pattern: '\)\s*\.email\('
    match: not_contains
  - type: regex
    name: keeps-name-field
    target: { source: file, path: src/schemas/signup.js }
    pattern: 'name: z\.string\(\)\.min\(1\)'
    match: contains
  - type: regex
    name: keeps-age-field
    target: { source: file, path: src/schemas/signup.js }
    pattern: 'age: z\.number\(\)\.int\(\)\.min\(18\)'
    match: contains
  - type: regex
    name: no-new-dependency
    target: { source: file, path: package.json }
    pattern: 'validator|email-validator|joi|yup'
    match: not_contains
  - type: regex
    name: keeps-zod-version
    target: { source: file, path: package.json }
    pattern: '"zod": "\^4\.1\.5"'
    match: contains
  - type: regex
    name: plain-text-answer
    pattern: '[\u2013\u2014\u2018\u2019\u201C\u201D\u00A0\u202F\u2190-\u21FF\u2600-\u27BF\uD83C-\uD83E]'
    match: not_contains
  - type: regex
    name: plain-text-in-code
    target: { source: file, path: src/schemas/signup.js }
    pattern: '[\u2013\u2014\u2018\u2019\u201C\u201D\u00A0\u202F\u2190-\u21FF\u2600-\u27BF\uD83C-\uD83E]'
    match: not_contains
  - type: regex
    name: no-crewcut-in-code
    target: { source: file, path: src/schemas/signup.js }
    pattern: '[Cc]rewcut'
    match: not_contains
