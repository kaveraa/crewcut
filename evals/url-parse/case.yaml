schema_version: "1.0"
name: url-parse
description: "A parsing task the standard library covers. Expected: the URL class, no regular expression, no new file, short answer."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: In links.js, hostOf is missing. Add it so describe works. It must return the host of a link, without port.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Grep, Glob, Skill]
runs: 3
graders:
  - type: file_exists
    name: no-new-file
    path: "**/*"
    exists: false
  - type: regex
    name: uses-url-class
    target: { source: file, path: links.js }
    pattern: 'new URL\(|URL\.parse\('
    match: contains
  - type: regex
    name: host-without-port
    target: { source: file, path: links.js }
    pattern: '\.hostname'
    match: contains
  - type: llm
    name: correct-function
    focus: { source: file, path: links.js }
    criteria: >
      links.js defines hostOf so that describe works for the three links in the
      file: hostOf('http://blog.example.org:8080/post/1?ref=home') gives
      'blog.example.org' (no port), and the other two give 'example.com' and
      'www.example.net'. The links array and describe are unchanged.
  - type: regex
    name: no-regex
    target: { source: file, path: links.js }
    pattern: 'RegExp\(|\.match\(|\.exec\(|\.replace\(/|\.split\(/'
    match: not_contains
  - type: regex
    name: no-new-dependency
    target: { source: file, path: package.json }
    pattern: '"dependencies"|"devDependencies"'
    match: not_contains
  - type: llm
    name: short-answer
    criteria: >
      The final message is at most 10 lines, counting blank lines and code.
      It names the added function and says it uses the URL parser's hostname.
      Citing one link as an example of the result is fine; going through all
      three sample links with their results is not. It does not repeat the
      whole function in a code block when it already described it in a
      sentence. At most one sentence is a caveat or a side note (for example
      that an invalid URL throws, or that the function is not exported).
