schema_version: "1.0"
name: explain-bug
description: "A question, not a change request. Expected: a complete explanation of the mechanism, no file edited, and no refusal to explain in the name of brevity."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Why does checkoutSummary print "You will pay NaN"? Explain, do not fix anything.
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Grep, Glob, Skill]
runs: 3
graders:
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
    arm: both
  - type: file_exists
    name: no-new-file
    path: "**/*"
    exists: false
  - type: regex
    name: names-the-check
    pattern: 'Number\.isFinite'
    match: contains
  - type: llm
    name: full-explanation
    criteria: >
      The final message explains the whole mechanism: form.amount is a string
      because it comes from the request body; Number.isFinite returns false
      for any string, even a numeric one, because it does not coerce; so
      formatPrice returns NaN and the template prints it. It names where the
      fix belongs (formatPrice, the shared function) without applying it. The
      explanation is complete and not truncated for brevity; it may be short,
      but every step above is present.
