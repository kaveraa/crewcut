schema_version: "1.0"
name: date-picker
description: "A form field that the platform covers natively. Expected: one label and one input, no component, no dependency, short answer."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a date of birth field to the signup form in index.html.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Grep, Glob, Skill]
runs: 3
graders:
  - type: file_exists
    name: no-new-file
    path: "**/*"
    exists: false
  - type: regex
    name: no-new-dependency
    target: { source: file, path: package.json }
    pattern: '"dependencies"|"devDependencies"'
    match: not_contains
  - type: regex
    name: native-date-input
    target: { source: file, path: index.html }
    pattern: 'type="date"'
    match: contains
  - type: regex
    name: no-script-added
    target: { source: file, path: index.html }
    pattern: '<script'
    match: not_contains
  - type: llm
    name: correct-field
    focus: { source: file, path: index.html }
    criteria: >
      The form has a date of birth field that works: a label whose "for"
      matches the id of an input with type="date" and a name attribute, placed
      inside the form before the submit button. The three existing fields and
      the submit button are unchanged.
  - type: regex
    name: only-asked-attributes
    target: { source: file, path: index.html }
    pattern: '(max|min|pattern|placeholder)='
    match: not_contains
  - type: llm
    name: short-answer
    criteria: >
      The final message is at most 8 lines, counting blank lines, and has no
      bullet points. It names the file and the field. It has at most four
      sentences in all. No sentence offers or suggests a script, a computed
      or dynamic value, or another change to the form; saying that the server
      still has to accept or check the field is fine.
